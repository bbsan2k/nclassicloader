name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-and-portable-tests:
    name: Repository, portable Rust and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Repository content and history
        run: |
          python scripts/test-repository.py
          python scripts/check-repository.py --history
          python scripts/test-rust-licenses.py
      - name: Apple runner and browser state tests (no simulator or console content)
        run: |
          python scripts/test-apple-app-unit.py
          node scripts/test-apple-transfer-page.js
      - name: Portable Rust tests and lint
        run: |
          cargo fmt --manifest-path rust/Cargo.toml -- --check
          cargo test --locked --manifest-path rust/Cargo.toml
          cargo test --locked --manifest-path rust/Cargo.toml --no-default-features
          cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install Ninja
        run: python -m pip install ninja
      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev
      - name: Build Rust native app and package
        run: python scripts/build-rust-desktop.py
      - name: Rust unit tests and lint
        shell: bash
        run: |
          export CLOVER_NATIVE_BUILD_DIR="$GITHUB_WORKSPACE/.build/native"
          if [ "$RUNNER_OS" = "Windows" ]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets --features native-app -- -D warnings
          cargo test --locked --manifest-path rust/Cargo.toml --all-targets --features native-app
      - name: Apple host Rust tests and lint (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export CLOVER_NATIVE_BUILD_DIR="$GITHUB_WORKSPACE/.build/native"
          cargo test --locked --manifest-path rust/Cargo.toml --all-targets --features native-app,apple-game
          cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets --features native-app,apple-game -- -D warnings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClassicMenu-Rust-${{ runner.os }}
          path: |
            dist/rust-desktop/*.zip
            dist/rust-desktop/*.tar.gz
          if-no-files-found: error
  apple-core-target-checks:
    name: ${{ matrix.platform }} core compile/link check (not an app test)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS simulator
            system: iOS
            sdk: iphonesimulator
            macho_platform: IOSSIMULATOR
          - platform: tvOS simulator
            system: tvOS
            sdk: appletvsimulator
            macho_platform: TVOSSIMULATOR
          - platform: iOS device
            system: iOS
            sdk: iphoneos
            macho_platform: IOS
          - platform: tvOS device
            system: tvOS
            sdk: appletvos
            macho_platform: TVOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Install Ninja
        run: python -m pip install ninja
      - name: Fetch pinned sources
        run: python scripts/bootstrap-portable.py
      - name: Test build-tree compatibility generation
        run: python scripts/test-apple-compat.py
      - name: Configure Apple core target
        run: >-
          cmake -S portable/core -B .build/apple-core -G Ninja
          -DCMAKE_SYSTEM_NAME=${{ matrix.system }}
          -DCMAKE_OSX_SYSROOT=${{ matrix.sdk }}
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCLOVER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Compile and link generated-ROM smoke executables
        run: cmake --build .build/apple-core --parallel 3
      - name: Verify binary platform
        run: |
          for name in clover_ares_smoke clover_ares_nes_smoke; do
            xcrun vtool -show-build ".build/apple-core/$name.app/$name" | grep -E 'platform +${{ matrix.macho_platform }}$'
          done
  apple-app-builds:
    name: ${{ matrix.platform }} simulator app compile/link (not runtime)
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, tvos]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim,aarch64-apple-tvos-sim
      - name: Fetch unmodified pinned sources
        run: python scripts/bootstrap-portable.py
      - name: Build Rust/SDL Classic simulator app and dependency notices
        run: python scripts/test-apple-app.py --platform ${{ matrix.platform }} --app preview --build-only
      - name: Preserve build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Apple-build-log-${{ matrix.platform }}
          path: .build/apple-app/${{ matrix.platform }}/build.log
          if-no-files-found: ignore
  portable-rust-target-checks:
    name: ${{ matrix.platform }} portable Rust library check (not an app build)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            target: aarch64-apple-ios
            runner: macos-latest
          - platform: tvOS
            target: aarch64-apple-tvos
            runner: macos-latest
          - platform: WebAssembly
            target: wasm32-unknown-unknown
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Check portable Rust library only
        run: cargo check --locked --manifest-path rust/Cargo.toml --lib --no-default-features --target ${{ matrix.target }}
